<!DOCTYPE html>
<html lang="en">
...<div id="status">Data load ho raha hai...</div>

<table border="1" cellpadding="8" cellspacing="0" id="customerTable" style="display:none; width:100%; border-collapse:collapse;">
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody id="customerBody"></tbody>
</table>

<script>
  // Version 14 ka naya Web App URL
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyzHtq_YRFobLLG8gPSNEI_Fejt5LXP7MD2wgXC5u5FidxB-TeDt6_aNWjvAXu8WFoj/exec";

  async function loadCustomers() {
    const statusEl = document.getElementById("status");
    const tableEl = document.getElementById("customerTable");
    const tbodyEl = document.getElementById("customerBody");

    try {
      const response = await fetch(WEB_APP_URL);
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }

      const data = await response.json();

      // Agar backend direct array bhej raha hai to data lo, warna data.data fallback
      const rows = Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : []);

      tbodyEl.innerHTML = "";

      if (rows.length === 0) {
        statusEl.textContent = "Sheet mein koi data nahi mila.";
        return;
      }

      rows.forEach((item, index) => {
        const tr = document.createElement("tr");

        const name = item.name || item.Name || item.customerName || "";
        const phone = item.phone || item.Phone || item.mobile || "";
        const rawDate = item.date || item.Date || "";

        // ISO date ko readable Indian date mein format karna (agar valid date ho)
        let formattedDate = rawDate;
        if (rawDate) {
          const d = new Date(rawDate);
          if (!isNaN(d.getTime())) {
            formattedDate = d.toLocaleDateString("en-IN", {
              day: "2-digit",
              month: "short",
              year: "numeric"
            });
          }
        }

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${escapeHtml(String(name))}</td>
          <td>${escapeHtml(String(phone))}</td>
          <td>${escapeHtml(String(formattedDate))}</td>
        `;
        tbodyEl.appendChild(tr);
      });

      statusEl.style.display = "none";
      tableEl.style.display = "table";
    } catch (err) {
      console.error("Fetch error:", err);
      statusEl.textContent = `Data load karne mein error aaya: ${err.message}`;
    }
  }

  // XSS se bachne ke liye simple escape helper
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  document.addEventListener("DOMContentLoaded", loadCustomers);
</script>
